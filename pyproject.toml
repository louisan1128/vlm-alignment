[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-alignment-v2"
version = "0.1.0"
description = "Literal VLM alignment evaluation between SeG BVH motions and retargeted G1 motions"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "openai>=1.50",
  "opencv-python>=4.8",
  "Pillow>=10",
  "torch>=2.1",
]

[project.scripts]
vlm-align = "vlm_alignment_v2.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
